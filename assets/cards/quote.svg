<svg xmlns="http://www.w3.org/2000/svg" width="880" height="132" viewBox="0 0 880 132" role="img" aria-label="quote of the day">
  <title>quote of the day</title>
  <style>
    .fi{opacity:1;animation:fi .55s ease-out forwards}
    @keyframes fi{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .fi{animation:none}
    }
    .cur{animation:blink 1.05s steps(1,end) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  </style>
  <rect width="880" height="132" rx="10" fill="#0A0A0B"/>
  <rect x="0.5" y="0.5" width="879" height="131" rx="9.5" fill="none" stroke="#212429"/>
  <rect x="0" y="0" width="880" height="34" rx="10" fill="#101014"/>
  <rect x="0" y="33" width="880" height="1" fill="#212429"/>
  <rect x="14" y="13" width="8" height="8" fill="#E01B24"/>
  <text x="30" y="21.5" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="11" font-weight="700"
        letter-spacing="1.7" fill="#E6EDF3">INTERROGATION LOG · ON THE RECORD</text>
  <text x="866" y="21.5" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="9.5"
              letter-spacing="1.2" fill="#7D8590">DEXTER MORGAN</text>
  <path d="M6 19L6 6L19 6" fill="none" stroke="#E01B24" stroke-width="1.6" stroke-linecap="square"/><path d="M874 19L874 6L861 6" fill="none" stroke="#E01B24" stroke-width="1.6" stroke-linecap="square"/><path d="M6 113L6 126L19 126" fill="none" stroke="#E01B24" stroke-width="1.6" stroke-linecap="square"/><path d="M874 113L874 126L861 126" fill="none" stroke="#E01B24" stroke-width="1.6" stroke-linecap="square"/>
  <text x="30" y="50" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="30" font-weight="700"
        fill="#5C0A0F" opacity="0.9">&#8220;</text>
  <g class="fi" style="animation-delay:120ms">
    <text x="56" y="72" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="13" fill="#E6EDF3">Blood. Sometimes it sets my teeth on edge,</text>
    <text x="56" y="93" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="13" fill="#E6EDF3">other times it helps me control the chaos.<tspan
      class="cur" fill="#E01B24" font-weight="700">_</tspan></text>
  </g>
  <rect x="30" y="56" width="2" height="44" fill="#E01B24"/>
  <text x="860" y="118" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace" font-size="8"
        letter-spacing="1.1" fill="#7D8590">ROTATES DAILY</text>
</svg>