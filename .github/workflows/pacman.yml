name: Generate contribution graph games

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/theme-arcade.py'
      - '.github/workflows/pacman.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Needed for .github/scripts/theme-arcade.py below.
      - uses: actions/checkout@v4

      # ── Arcade games: pacman + breakout + galaga, written to dist/ ──
      - name: Generate arcade contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,breakout,galaga'
          player_style: 'aggressive'

      # ── Blood-red snake eating the contribution grid, appended to dist/ ──
      - name: Generate snake contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E01B24&color_dots=#161B22,#5C0A0F,#8E1219,#C1161F,#FF4C4C
            dist/snake.svg?palette=github-light&color_snake=#C1161F&color_dots=#F0E4E4,#F5B5B5,#E8737B,#D62D38,#A80D16

      # The arcade action hardcodes a GitHub-green palette and exposes no
      # colour inputs, so the SVGs are repainted here. This step also inlines
      # remote sprite images, which camo refuses to fetch from inside an SVG.
      #
      # The snake SVGs are skipped: already red, self-contained, and written
      # by a Docker action running as root, so rewriting them fails.
      - name: Theme arcade SVGs red and inline sprites
        run: python3 .github/scripts/theme-arcade.py

      - name: List generated files
        run: ls -la dist/

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
